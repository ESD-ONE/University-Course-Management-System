server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: identity-access-service
          uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/identity/**
          filters:
            - StripPrefix=2

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
