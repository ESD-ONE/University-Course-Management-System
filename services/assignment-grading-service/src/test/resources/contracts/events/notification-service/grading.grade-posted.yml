description: "notification-service tells a student their grade"
name: "grading_grade_posted"
label: "grading.grade-posted"
input:
  triggeredBy: "gradePosted()"
outputMessage:
  sentTo: "ucms.events"
  headers:
    amqp_receivedRoutingKey: "grading.grade-posted"
  body:
    eventId: "0e0e0e0e-0e0e-0e0e-0e0e-0e0e0e0e0e0e"
    type: "grading.grade-posted"
    occurredAt: "2025-09-02T08:30:00Z"
    data:
      studentId: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
      title: "Essay 1"
      courseCode: "COSC5105"
      marks: "92"
      maxMarks: 100
  matchers:
    body:
      - path: "$.eventId"
        type: "by_regex"
        predefined: "uuid"
      - path: "$.occurredAt"
        type: "by_regex"
        value: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z"
