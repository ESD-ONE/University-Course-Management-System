description: "notification-service tells the lecturer that a student submitted work"
name: "grading_submission_received"
label: "grading.submission-received"
input:
  triggeredBy: "submissionReceived()"
outputMessage:
  sentTo: "ucms.events"
  headers:
    amqp_receivedRoutingKey: "grading.submission-received"
  body:
    eventId: "0e0e0e0e-0e0e-0e0e-0e0e-0e0e0e0e0e0e"
    type: "grading.submission-received"
    occurredAt: "2025-09-02T08:30:00Z"
    data:
      lecturerId: "88888888-8888-8888-8888-888888888888"
      title: "Essay 1"
      courseCode: "COSC5105"
  matchers:
    body:
      - path: "$.eventId"
        type: "by_regex"
        predefined: "uuid"
      - path: "$.occurredAt"
        type: "by_regex"
        value: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z"
