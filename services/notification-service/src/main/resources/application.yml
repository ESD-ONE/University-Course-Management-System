server:
  port: 8087
  # Finish in-flight requests on shutdown, so a rolling redeploy drops nothing.
  shutdown: graceful

spring:
  application:
    name: notification-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    loadbalancer:
      cache:
        enabled: false
      retry:
        # Reads only (the default): a failed GET is tried once more on another replica.
        max-retries-on-next-service-instance: 1
    discovery:
      client:
        health-indicator:
          enabled: false
        composite-indicator:
          enabled: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:ucms}
    username: ${DB_USER:notification_svc}
    password: ${DB_PASSWORD:}
    # Several replicas share one Postgres (max_connections 200): keep each pool small.
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_schema: notification
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: notification
    default-schema: notification
    create-schemas: false
  # Live-push fan-out between replicas (service/LivePushFanout).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USER:ucms_admin}
    password: ${RABBITMQ_PASSWORD:}
    listener:
      simple:
        # A message that keeps failing goes to the dead-letter queue instead of
        # being redelivered forever.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
  mvc:
    async:
      # Live notification stream (SSE) — reconnected by the browser when it ends.
      request-timeout: 1800000

ucms:
  # Keycloak issues every token (docs/keycloak-integration.md). url is how this service
  # reaches it; issuer is the public URL browsers use, which tokens carry as "iss".
  keycloak:
    url: ${KEYCLOAK_URL:http://localhost:8180/auth}
    realm: ${KEYCLOAK_REALM:ucms}
    issuer: ${KEYCLOAK_ISSUER:}
    client-id: svc-notification
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
    service-role: svc:notification
  events:
    enabled: ${UCMS_EVENTS_ENABLED:true}
  mail:
    enabled: ${UCMS_MAIL_ENABLED:false}
    from: ${UCMS_MAIL_FROM:no-reply@ucms.local}
  app-url: ${UCMS_APP_URL:http://localhost:4200}
  identity-service-uri: http://identity-access-service
  enrollment-service-uri: http://enrollment-service
  # The *-uri values above are load-balanced service names, resolved here; a Docker
  # service name resolves to every replica (see config/DnsDiscoveryClient).
  discovery:
    services:
      identity-access-service: ${IDENTITY_SERVICE_URI:http://localhost:8081}
      enrollment-service: ${ENROLLMENT_SERVICE_URI:http://localhost:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false
    mail:
      enabled: false

logging:
  pattern:
    # Every line carries the X-Request-Id of the request it belongs to.
    level: "%5p [%X{requestId:-}]"
