spring:
  datasource:
    url: jdbc:h2:mem:notificationdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS notification
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

ucms:
  # Tokens in tests are signed with src/test/resources/keycloak-test-private.pem (see
  # KeycloakTestTokens); this is its public half, used instead of Keycloak's JWKS.
  keycloak:
    url: http://keycloak.test/auth
    issuer: http://keycloak.test/auth/realms/ucms
    client-id: svc-notification
    client-secret: test
    service-role: svc:notification
    public-key: |
      -----BEGIN PUBLIC KEY-----
      MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEArNteaUwiuIk8Ts8I40sz
      EvivOy9QpYxIWh483RrZPUHtVqLpoPn9lZiA3YCR01KRuMuCj+41JG6hhqkaNWEn
      dCokNjrTtGRs+VP0+ig9LKDEsVif9g9S3owHBoI6stl/+YHh6R24Rs6T5c0YQPZJ
      o50GBmvwdb/q5T8x3SbBKljtJgho8s3voCn9JSUXFdtxiElK2gdpObrHUnqW5GLR
      qdwOSpY6DCqlAKx/K3ucKoqJIh5dvp1Iwf97WSrK6ROZT9vYIaqxXOqFDEROBbhA
      /fh4gnWZZ0UEoVquzHaS1/pjt56r2Zm42Io+kUsxvWG0PwE42EFReNNqlP9z3b2g
      WQIDAQAB
      -----END PUBLIC KEY-----
  events:
    enabled: false
  # No Redis in tests: pushes are delivered on the one instance.
  live-push:
    fanout:
      enabled: false
