server:
  port: 8084

spring:
  application:
    name: academic-structure-service
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:ucms}
    username: ${DB_USER:academic_structure_svc}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        # One shared "ucms" database, one schema per service — this service only
        # ever reads/writes its own schema, and its DB role has no grants outside
        # it. See docs/architecture/DATA_GOVERNANCE.md.
        default_schema: academic
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: academic
    default-schema: academic
    # The schema is created by infra/init-schemas.sh as the admin role, not by
    # this service's own (deliberately schema-scoped, non-superuser) role.
    create-schemas: false

ucms:
  jwt:
    secret: ${JWT_SECRET:}
  identity-service-uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
