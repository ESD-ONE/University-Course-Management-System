spring:
  datasource:
    # INIT creates the identity_access schema before Hibernate's create-drop DDL
    # runs, mirroring main/application.yml's hibernate.default_schema — without
    # it, H2 has nowhere to put "identity_access.roles" and every test insert fails.
    url: jdbc:h2:mem:identitydb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS identity_access
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

ucms:
  jwt:
    secret: test-secret-key-used-only-for-automated-tests-not-real
    expiration-minutes: 60
