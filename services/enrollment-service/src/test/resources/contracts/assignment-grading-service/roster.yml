description: "assignment-grading-service reads the students of an offering to build the grading list"
name: "roster"
request:
  method: "GET"
  urlPath: "/course-enrollments"
  queryParameters:
    offeringId: "11111111-1111-1111-1111-111111111111"
    size: 200
response:
  status: 200
  headers:
    Content-Type: "application/json"
  body:
    content:
      - id: "eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee"
        studentId: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
        studentName: "K. Perera"
        studentNumber: "STU-2025-0001"
        status: "ENROLLED"
