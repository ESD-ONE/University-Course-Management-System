description: "notification-service reads the students of an offering to notify them of a new assignment"
name: "roster"
request:
  method: "GET"
  urlPath: "/course-enrollments"
  queryParameters:
    offeringId: "11111111-1111-1111-1111-111111111111"
    size: 200
response:
  status: 200
  headers:
    Content-Type: "application/json"
  body:
    content:
      - studentId: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
        status: "ENROLLED"
