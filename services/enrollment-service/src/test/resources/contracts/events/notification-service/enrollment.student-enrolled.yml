description: "notification-service tells a student they are enrolled in a course"
name: "enrollment_student_enrolled"
label: "enrollment.student-enrolled"
input:
  triggeredBy: "studentEnrolled()"
outputMessage:
  sentTo: "ucms.events"
  headers:
    amqp_receivedRoutingKey: "enrollment.student-enrolled"
  body:
    eventId: "0e0e0e0e-0e0e-0e0e-0e0e-0e0e0e0e0e0e"
    type: "enrollment.student-enrolled"
    occurredAt: "2025-09-02T08:30:00Z"
    data:
      studentId: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
      courseCode: "COSC5105"
      courseName: "Introduction to Programming"
      onBehalf: false
  matchers:
    body:
      - path: "$.eventId"
        type: "by_regex"
        predefined: "uuid"
      - path: "$.occurredAt"
        type: "by_regex"
        value: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z"
