description: "notification-service tells a student they are registered in a degree program"
name: "enrollment_program_registered"
label: "enrollment.program-registered"
input:
  triggeredBy: "programRegistered()"
outputMessage:
  sentTo: "ucms.events"
  headers:
    amqp_receivedRoutingKey: "enrollment.program-registered"
  body:
    eventId: "0e0e0e0e-0e0e-0e0e-0e0e-0e0e0e0e0e0e"
    type: "enrollment.program-registered"
    occurredAt: "2025-09-02T08:30:00Z"
    data:
      studentId: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
      programName: "BSc in Computer Science"
      programCode: "BSC-CS"
  matchers:
    body:
      - path: "$.eventId"
        type: "by_regex"
        predefined: "uuid"
      - path: "$.occurredAt"
        type: "by_regex"
        value: "[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z"
