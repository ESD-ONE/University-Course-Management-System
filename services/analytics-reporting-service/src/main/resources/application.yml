server:
  port: 8088
  # Finish in-flight requests on shutdown, so a rolling redeploy drops nothing.
  shutdown: graceful

spring:
  application:
    name: analytics-reporting-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    loadbalancer:
      cache:
        enabled: false
      retry:
        # Reads only (the default): a failed GET is tried once more on another replica.
        max-retries-on-next-service-instance: 1
    discovery:
      client:
        health-indicator:
          enabled: false
        composite-indicator:
          enabled: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:ucms}
    username: ${DB_USER:analytics_svc}
    password: ${DB_PASSWORD:}
    # Several replicas share one Postgres (max_connections 200): keep each pool small.
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_schema: analytics
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: analytics
    default-schema: analytics
    create-schemas: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USER:ucms_admin}
    password: ${RABBITMQ_PASSWORD:}
    listener:
      simple:
        default-requeue-rejected: false

ucms:
  # Keycloak issues every token (docs/keycloak-integration.md). url is how this service
  # reaches it; issuer is the public URL browsers use, which tokens carry as "iss".
  keycloak:
    url: ${KEYCLOAK_URL:http://localhost:8180/auth}
    realm: ${KEYCLOAK_REALM:ucms}
    issuer: ${KEYCLOAK_ISSUER:}
    client-id: svc-analytics-reporting
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
    service-role: svc:analytics
  events:
    enabled: ${UCMS_EVENTS_ENABLED:true}
  scheduling:
    enabled: ${UCMS_SCHEDULING_ENABLED:true}
  reports:
    # Schedules ("Weekly · Mondays 08:00") are interpreted in this zone.
    zone: ${UCMS_REPORTS_ZONE:Asia/Colombo}
  identity-service-uri: http://identity-access-service
  academic-service-uri: http://academic-structure-service
  enrollment-service-uri: http://enrollment-service
  grading-service-uri: http://assignment-grading-service
  # The *-uri values above are load-balanced service names, resolved here; a Docker
  # service name resolves to every replica (see config/DnsDiscoveryClient).
  discovery:
    services:
      identity-access-service: ${IDENTITY_SERVICE_URI:http://localhost:8081}
      academic-structure-service: ${ACADEMIC_STRUCTURE_SERVICE_URI:http://localhost:8084}
      enrollment-service: ${ENROLLMENT_SERVICE_URI:http://localhost:8085}
      assignment-grading-service: ${ASSIGNMENT_GRADING_SERVICE_URI:http://localhost:8086}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9002}
    access-key: ${MINIO_ACCESS_KEY:ucms_admin}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_REPORTS_BUCKET:ucms-reports}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    rabbit:
      enabled: false

logging:
  pattern:
    # Every line carries the X-Request-Id of the request it belongs to.
    level: "%5p [%X{requestId:-}]"
