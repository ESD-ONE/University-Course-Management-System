# Keycloak's pages: only what Keycloak doesn't send itself. It already sets its own CSP,
# HSTS, X-Content-Type-Options and a stricter Referrer-Policy (no-referrer) — repeating
# ours would stack a weaker referrer policy on top. Having any add_header here also stops
# the app's CSP being inherited from the server block.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
