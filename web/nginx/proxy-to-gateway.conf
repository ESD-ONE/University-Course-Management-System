proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Overwritten, never appended: the gateway keys anonymous rate limits on this, so it must
# be the address nginx resolved above, not whatever the client put in its own header.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $original_proto;
proxy_set_header X-Request-Id $request_id;
