# The Angular app's policy. frame-src/frame-ancestors 'self': keycloak-js runs a hidden
# same-origin iframe (silent-check-sso.html and Keycloak's login-status iframe).
# style-src 'unsafe-inline': Angular component styles are injected at runtime.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
