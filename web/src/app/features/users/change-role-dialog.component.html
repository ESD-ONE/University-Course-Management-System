<div class="modal-overlay" (click)="close()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <div class="modal-head">
      <div>
        <h3>Change Role</h3>
        <p>{{ user.name }} · {{ user.email }}</p>
      </div>
      <button class="modal-close" (click)="close()">✕</button>
    </div>
    <div class="modal-body">
      @if (errorMessage()) {
        <div class="modal-error">{{ errorMessage() }}</div>
      }
      <div class="field" style="margin-bottom:0;">
        <label for="crRole">Role</label>
        <select id="crRole" [(ngModel)]="selectedRoleId" [disabled]="submitting() || loading()">
          @for (r of roles(); track r.id) {
            <option [value]="r.id">{{ r.name }} ({{ r.kind | titlecase }})</option>
          }
        </select>
        <p style="font-size:11.5px;color:var(--ink-faint);margin:8px 0 0;">
          Changing the account kind (Student/Lecturer/Administrator) changes which screens this user sees.
          A custom role (e.g. "Program Head") carries the same account kind plus its own extra permissions.
        </p>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-secondary" (click)="close()">Cancel</button>
      <button type="button" class="btn btn-primary" [disabled]="submitting()" (click)="save()">
        {{ submitting() ? 'Saving…' : 'Save' }}
      </button>
    </div>
  </div>
</div>
