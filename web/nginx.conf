server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA: any path that isn't a real static file falls back to index.html
    # so client-side routing (app.routes.ts) handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API passthrough to the Gateway container, on the shared
    # ucms_default docker network — see src/app/core/config/api.config.ts.
    location /api/ {
        proxy_pass http://ucms-gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets can be cached hard; index.html must always be revalidated so a
    # new deploy is picked up immediately instead of serving a stale shell.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
