# The scheme the browser actually used. HTTPS for the domain is terminated by the host's
# shared nginx in front of this container, which passes it on as X-Forwarded-Proto;
# Keycloak needs the real one (it refuses plain-http sign-ins from outside).
map $http_x_forwarded_proto $original_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Requests arrive through the host nginx (and Docker's port proxy), so $remote_addr would
# be the same internal address for everyone. Take the client from X-Forwarded-For, but
# only the hops added by these private ranges — a client can't spoof its way past them.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header   X-Forwarded-For;
real_ip_recursive on;

# Edge rate limits, per client IP. A flood guard only: a campus NAT can put a whole lab
# behind one address, so these are generous; per-user fairness is the gateway's job, and
# per-account password guessing is stopped by Keycloak's brute-force lockout.
limit_req_zone  $binary_remote_addr zone=kc_login:10m rate=30r/m;
limit_req_zone  $binary_remote_addr zone=kc_token:10m rate=120r/m;
limit_req_zone  $binary_remote_addr zone=api_ip:20m   rate=50r/s;
limit_conn_zone $binary_remote_addr zone=sse_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# Access log with the request id (also sent to the gateway and every service as
# X-Request-Id) and the gateway replica that served the request.
log_format ucms '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                'rt=$request_time upstream=$upstream_addr rid=$request_id';
access_log /var/log/nginx/access.log ucms;

# Every gateway replica behind one name; "resolve" re-reads Docker's DNS so replicas
# added or replaced later are picked up without reloading nginx.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream ucms_gateway {
    zone ucms_gateway 64k;
    least_conn;
    server gateway:8080 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/app-csp.conf;

    # Only the two upload endpoints take large bodies (see below).
    client_max_body_size 1m;

    # Angular SPA: any path that isn't a real static file falls back to index.html
    # so client-side routing (app.routes.ts) handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assignment briefs and submissions are up to 20MB (assignment-grading-service's limit).
    location ~ ^/api/grading/assignments/[^/]+/(brief|submissions)$ {
        client_max_body_size 25m;
        limit_req zone=api_ip burst=200 nodelay;
        proxy_pass http://ucms_gateway;
        include /etc/nginx/snippets/proxy-to-gateway.conf;
        proxy_request_buffering off;
    }

    # Live notification stream (Server-Sent Events): must not be buffered, and must be
    # allowed to stay open far longer than a normal request.
    location /api/notification/notifications/stream {
        limit_conn sse_conn 10;
        proxy_pass http://ucms_gateway;
        include /etc/nginx/snippets/proxy-to-gateway.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Same-origin API passthrough to the gateway replicas — see
    # src/app/core/config/api.config.ts.
    location /api/ {
        limit_req zone=api_ip burst=200 nodelay;
        proxy_pass http://ucms_gateway;
        include /etc/nginx/snippets/proxy-to-gateway.conf;
    }

    # Keycloak's administration surface stays off the public site: administrators use
    # the console over the SSH tunnel to 127.0.0.1:8180. Browsers only need the ucms realm.
    location ^~ /auth/admin/         { return 404; }
    location ^~ /auth/realms/master/ { return 404; }
    location ^~ /auth/metrics        { return 404; }
    location ^~ /auth/health         { return 404; }

    # Password form submissions — the endpoint credential-stuffing would hammer.
    location ^~ /auth/realms/ucms/login-actions/ {
        limit_req zone=kc_login burst=30 nodelay;
        proxy_pass http://ucms-keycloak:8080;
        include /etc/nginx/snippets/proxy-to-keycloak.conf;
    }

    # Code exchange and silent refresh — every open tab refreshes every few minutes.
    location ^~ /auth/realms/ucms/protocol/openid-connect/token {
        limit_req zone=kc_token burst=60 nodelay;
        proxy_pass http://ucms-keycloak:8080;
        include /etc/nginx/snippets/proxy-to-keycloak.conf;
    }

    # Keycloak (sign-in page, token endpoint) on the app's own origin, so the browser
    # never needs a second host — see src/app/core/config/api.config.ts. "^~" stops the
    # static-asset regex below from grabbing Keycloak's own .js/.css under /auth.
    location ^~ /auth/ {
        proxy_pass http://ucms-keycloak:8080;
        include /etc/nginx/snippets/proxy-to-keycloak.conf;
    }

    # Static assets can be cached hard; index.html must always be revalidated so a
    # new deploy is picked up immediately instead of serving a stale shell. A location
    # with its own add_header drops the server-level ones, hence the includes.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/app-csp.conf;
    }
}
