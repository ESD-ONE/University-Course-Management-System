# Frontend (Angular/TypeScript) SonarQube project — analyzed separately from the
# backend's Maven reactor (sonar-maven-plugin, see root pom.xml) since this isn't a
# Maven module. Run from web/: sonar-scanner -Dsonar.host.url=... -Dsonar.token=...
# (the Jenkinsfile's "Code Quality" stage does this via the sonarsource/sonar-scanner-cli
# Docker image, same pattern as the existing Security Scan stage's trivy/npm-audit runs).
sonar.projectKey=ucms-frontend
sonar.projectName=UCMS Web
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/dist/**
# Produced by `ng test --code-coverage --watch=false --browsers=ChromeHeadless`.
sonar.javascript.lcov.reportPaths=coverage/web/lcov.info
sonar.sourceEncoding=UTF-8
