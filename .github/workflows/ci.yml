name: CI

on:
  pull_request:
    branches: [develop, release, main]
  push:
    branches: [develop, release, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn -B verify

      - name: Build identity-access-service image
        run: |
          cd services/identity-access-service
          docker build -t ucms/identity-access-service:${{ github.sha }} .

      - name: Build gateway image
        run: |
          cd services/gateway
          docker build -t ucms/gateway:${{ github.sha }} .
