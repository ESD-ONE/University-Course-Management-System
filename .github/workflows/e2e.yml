# End-to-end tests: the whole system started with Docker Compose on the runner, and the
# Playwright suite in e2e/ run against it on Chromium, Firefox and WebKit.
#
# This runs on GitHub's machines, not on the Jenkins host: the stack needs about 5 GB of
# memory, and the Jenkins host also runs production. The main build stays in Jenkins
# (see Jenkinsfile).
name: End-to-end tests

on:
  # Every night, against the default branch.
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC
  # On demand, from the Actions tab.
  workflow_dispatch:
  # When the tests or their stack change, so a broken setup is caught in the pull request.
  pull_request:
    paths:
      - 'e2e/**'
      - 'infra/docker-compose.e2e.yml'
      - 'infra/e2e.env'
      - 'infra/e2e-up.sh'
      - 'infra/e2e-down.sh'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

# A newer run for the same branch replaces one still in progress.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright against the full stack
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      # Builds the service jars and the frontend, then starts every container and waits
      # until all of them are healthy.
      - name: Start the system
        run: infra/e2e-up.sh

      - name: Install the test tools
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: Run the tests
        working-directory: e2e
        run: npx playwright test

      # The report has a screenshot and a trace for every failed test.
      - name: Keep the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      # When something fails, what the services logged is usually the explanation.
      - name: Keep the container logs
        if: ${{ failure() }}
        run: |
          mkdir -p e2e-logs
          docker compose --env-file infra/e2e.env -f infra/docker-compose.e2e.yml ps -a > e2e-logs/containers.txt
          docker compose --env-file infra/e2e.env -f infra/docker-compose.e2e.yml logs --no-color > e2e-logs/all-services.log

      - name: Upload the container logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: container-logs
          path: e2e-logs/
          retention-days: 14

      - name: Stop the system
        if: ${{ always() }}
        run: infra/e2e-down.sh
