# Deploys the application services onto the Contabo host, joining the networks created by
# the infra stack at /opt/ucms/docker-compose.infra.yml (Postgres/Redis/RabbitMQ/MinIO/
# Keycloak): ucms_edge, ucms_app, ucms_data — see that file. Services reach the infra by
# container name on their container ports (5432 / 6379 / 5672 / 9000); the
# 127.0.0.1-only published ports are for the SSH-tunnelled local dev workflow only.
#
# One shared Postgres database ("ucms"), one schema per service — each service connects
# with its own schema-scoped role. See infra/init-schemas.sh and
# docs/architecture/DATA_GOVERNANCE.md.
#
# Replicas: the busier services run two copies (override with *_REPLICAS in .env — each
# copy is capped at 768 MB, so check the host's free memory first). Callers reach a
# service by its Compose service name, which Docker's DNS answers with every replica;
# the gateway and the services load-balance across them and skip unhealthy ones. See
# docs/security-loadbalancing-ratelimit-plan.md.
#
# Every service has a healthcheck against its own /actuator/health, and every depends_on
# uses `condition: service_healthy` — Compose's bare form only waits for "container
# started", not for Spring Boot to be ready, which produced a window of 502s after every
# redeploy. RabbitMQ/Redis/MinIO/SMTP are deliberately NOT part of any health indicator:
# they're best-effort side channels (events, revocation, files, email), and a blip in one
# must not mark a service unhealthy and block the whole stack from starting.
#
# Required in the .env next to this file, in addition to the per-service DB passwords:
# RABBITMQ_PASSWORD, REDIS_PASSWORD, MINIO_ROOT_PASSWORD, the seven KC_SVC_*_SECRET
# Keycloak client secrets and KEYCLOAK_PUBLIC_URL (the same values the infra stack was
# started with), and optionally SMTP_HOST/SMTP_PORT/SMTP_USER/SMTP_PASSWORD +
# UCMS_MAIL_ENABLED=true to send real email.
#
# Keycloak (ucms-keycloak) is part of the infra stack, not this one, so no depends_on
# can point at it; services start without it and fetch its signing keys on first use.
#
# Usage on the server — rolling, zero-downtime (starts new replicas, waits until they're
# healthy, then retires the old ones):
#   cd /opt/ucms-app/infra && ./rolling-deploy.sh
# First deploy, or after changing replica counts: the same script works; so does
#   docker compose --env-file .env -f docker-compose.deploy.yml up -d --build

x-messaging: &messaging
  RABBITMQ_HOST: ucms-rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ucms_admin
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

# Every token is issued by Keycloak. Services reach it inside the network; the issuer is
# the public URL browsers use (KEYCLOAK_PUBLIC_URL, e.g. https://esd.azhosting.fun/auth).
x-keycloak: &keycloak
  KEYCLOAK_URL: http://ucms-keycloak:8080/auth
  KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:?set KEYCLOAK_PUBLIC_URL, e.g. https://esd.azhosting.fun/auth}/realms/ucms

x-storage: &storage
  MINIO_ENDPOINT: http://ucms-minio:9000
  MINIO_ACCESS_KEY: ucms_admin
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

x-redis: &redis
  REDIS_HOST: ucms-redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}

# Every Java service: no root, no writable filesystem except /tmp, no Linux capabilities,
# bounded memory/CPU, and long enough to finish in-flight requests when stopped.
x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  mem_limit: 768m
  cpus: 1.0
  stop_grace_period: 30s

services:
  identity-access-service:
    <<: *hardening
    build:
      context: ../services/identity-access-service
    deploy:
      replicas: ${IDENTITY_REPLICAS:-2}
    environment:
      <<: [*messaging, *keycloak, *redis]
      DB_HOST: ucms-postgres
      DB_PORT: 5432
      DB_NAME: ucms
      DB_USER: identity_access_svc
      DB_PASSWORD: ${IDENTITY_ACCESS_SVC_PASSWORD}
      KEYCLOAK_CLIENT_SECRET: ${KC_SVC_IDENTITY_ACCESS_SECRET}
    healthcheck: &service-healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      # Healthy as soon as it answers; failures in the first 2 minutes don't count, so a
      # cold start of the whole stack (every JVM at once) isn't declared dead.
      start_period: 120s
    networks: [app, data]

  base-service:
    # Renamed from reference-data-service (infrastructure rename only). Requires the
    # one-time manual schema/role rename before first deploy over an existing database —
    # see docs/implementation-change-log.md.
    <<: *hardening
    build:
      context: ../services/base-service
    deploy:
      replicas: ${BASE_REPLICAS:-1}
    environment:
      <<: *keycloak
      DB_HOST: ucms-postgres
      DB_PORT: 5432
      DB_NAME: ucms
      DB_USER: base_svc
      DB_PASSWORD: ${BASE_SVC_PASSWORD}
      KEYCLOAK_CLIENT_SECRET: ${KC_SVC_BASE_SECRET}
      # Department-deletion dependents check (gap-analysis-report.md G-05).
      ACADEMIC_STRUCTURE_SERVICE_URI: http://academic-structure-service:8084
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
    networks: [app, data]

  academic-structure-service:
    <<: *hardening
    build:
      context: ../services/academic-structure-service
    deploy:
      replicas: ${ACADEMIC_REPLICAS:-2}
    environment:
      <<: [*keycloak, *redis]
      DB_HOST: ucms-postgres
      DB_PORT: 5432
      DB_NAME: ucms
      DB_USER: academic_structure_svc
      DB_PASSWORD: ${ACADEMIC_STRUCTURE_SVC_PASSWORD}
      KEYCLOAK_CLIENT_SECRET: ${KC_SVC_ACADEMIC_STRUCTURE_SECRET}
      # Periodic role/permission-catalog sync; scope assignments (cached in Redis).
      IDENTITY_SERVICE_URI: http://identity-access-service:8081
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
    depends_on:
      identity-access-service:
        condition: service_healthy
    networks: [app, data]

  enrollment-service:
    <<: *hardening
    build:
      context: ../services/enrollment-service
    deploy:
      replicas: ${ENROLLMENT_REPLICAS:-2}
    environment:
      <<: [*messaging, *keycloak]
      DB_HOST: ucms-postgres
      DB_PORT: 5432
      DB_NAME: ucms
      DB_USER: enrollment_svc
      DB_PASSWORD: ${ENROLLMENT_SVC_PASSWORD}
      KEYCLOAK_CLIENT_SECRET: ${KC_SVC_ENROLLMENT_SECRET}
      IDENTITY_SERVICE_URI: http://identity-access-service:8081
      ACADEMIC_STRUCTURE_SERVICE_URI: http://academic-structure-service:8084
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
    depends_on:
      academic-structure-service:
        condition: service_healthy
    networks: [app, data]

  assignment-grading-service:
    <<: *hardening
    build:
      context: ../services/assignment-grading-service
    deploy:
      replicas: ${GRADING_REPLICAS:-1}
    environment:
      <<: [*messaging, *storage, *keycloak]
      DB_HOST: ucms-postgres
      DB_PORT: 5432
      DB_NAME: ucms
      DB_USER: assignment_grading_svc
      DB_PASSWORD: ${ASSIGNMENT_GRADING_SVC_PASSWORD}
      KEYCLOAK_CLIENT_SECRET: ${KC_SVC_ASSIGNMENT_GRADING_SECRET}
      MINIO_BUCKET: ucms-assignments
      IDENTITY_SERVICE_URI: http://identity-access-service:8081
      ACADEMIC_STRUCTURE_SERVICE_URI: http://academic-structure-service:8084
      ENROLLMENT_SERVICE_URI: http://enrollment-service:8085
      BASE_SERVICE_URI: http://base-service:8083
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
    depends_on:
      enrollment-service:
        condition: service_healthy
    networks: [app, data]

  notification-service:
    <<: *hardening
    build:
      context: ../services/notification-service
    deploy:
      replicas: ${NOTIFICATION_REPLICAS:-2}
    environment:
      # Redis: live pushes are broadcast to every replica (LivePushFanout).
      <<: [*messaging, *keycloak, *redis]
      DB_HOST: ucms-postgres
      DB_PORT: 5432
      DB_NAME: ucms
      DB_USER: notification_svc
      DB_PASSWORD: ${NOTIFICATION_SVC_PASSWORD}
      KEYCLOAK_CLIENT_SECRET: ${KC_SVC_NOTIFICATION_SECRET}
      IDENTITY_SERVICE_URI: http://identity-access-service:8081
      ENROLLMENT_SERVICE_URI: http://enrollment-service:8085
      UCMS_MAIL_ENABLED: ${UCMS_MAIL_ENABLED:-false}
      UCMS_MAIL_FROM: ${UCMS_MAIL_FROM:-no-reply@ucms.local}
      UCMS_APP_URL: ${UCMS_APP_URL:-https://esd.azhosting.fun}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8087/actuator/health"]
    depends_on:
      identity-access-service:
        condition: service_healthy
    networks: [app, data]

  analytics-reporting-service:
    <<: *hardening
    build:
      context: ../services/analytics-reporting-service
    deploy:
      replicas: ${ANALYTICS_REPLICAS:-1}
    environment:
      <<: [*messaging, *storage, *keycloak]
      DB_HOST: ucms-postgres
      DB_PORT: 5432
      DB_NAME: ucms
      DB_USER: analytics_svc
      DB_PASSWORD: ${ANALYTICS_SVC_PASSWORD}
      KEYCLOAK_CLIENT_SECRET: ${KC_SVC_ANALYTICS_REPORTING_SECRET}
      MINIO_REPORTS_BUCKET: ucms-reports
      IDENTITY_SERVICE_URI: http://identity-access-service:8081
      ACADEMIC_STRUCTURE_SERVICE_URI: http://academic-structure-service:8084
      ENROLLMENT_SERVICE_URI: http://enrollment-service:8085
      ASSIGNMENT_GRADING_SERVICE_URI: http://assignment-grading-service:8086
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8088/actuator/health"]
    depends_on:
      assignment-grading-service:
        condition: service_healthy
    networks: [app, data]

  gateway:
    <<: *hardening
    build:
      context: ../services/gateway
    deploy:
      replicas: ${GATEWAY_REPLICAS:-2}
    environment:
      IDENTITY_SERVICE_URI: http://identity-access-service:8081
      BASE_SERVICE_URI: http://base-service:8083
      ACADEMIC_STRUCTURE_SERVICE_URI: http://academic-structure-service:8084
      ENROLLMENT_SERVICE_URI: http://enrollment-service:8085
      ASSIGNMENT_GRADING_SERVICE_URI: http://assignment-grading-service:8086
      NOTIFICATION_SERVICE_URI: http://notification-service:8087
      ANALYTICS_REPORTING_SERVICE_URI: http://analytics-reporting-service:8088
      # Comma-separated; Spring binds it to a list. Only the HTTPS site: the app is no
      # longer reachable over plain HTTP on the server's address.
      CORS_ALLOWED_ORIGIN: https://esd.azhosting.fun
      # Token backstop (G-18), logout revocation (G-11) and the shared rate-limit buckets.
      <<: [*keycloak, *redis]
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
    # No published port: with several replicas there's no single one to publish. The SSH
    # tunnel reaches the API through the web container instead (127.0.0.1:8091/api/).
    depends_on:
      identity-access-service:
        condition: service_healthy
      base-service:
        condition: service_healthy
      academic-structure-service:
        condition: service_healthy
      enrollment-service:
        condition: service_healthy
      assignment-grading-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      analytics-reporting-service:
        condition: service_healthy
    networks: [edge, app]

  web:
    build:
      context: ../web
    container_name: ucms-web
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: ["no-new-privileges:true"]
    # nginx's master process starts as root to bind port 80 and then runs its workers as
    # the unprivileged "nginx" user; these are the only capabilities that takes.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    mem_limit: 256m
    ports:
      # Loopback only — nothing reaches the app over plain HTTP from outside. HTTPS for
      # esd.azhosting.fun is terminated by another project's nginx-proxy container
      # (proj001-nginx-proxy-1, not managed by this repo), which reaches this container
      # by name over the "legacy" network below. That network is declared here, not just
      # joined by hand after the fact, specifically so every redeploy of this
      # single-instance container keeps the connection — a manual `docker network
      # connect` doesn't survive a container recreation, which is exactly what broke
      # this after the first production deploy (web recreated -> dropped off that
      # network -> the proxy's cached DNS pointed nowhere -> 502 until it was reloaded).
      - "127.0.0.1:8091:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks: [edge, legacy]

networks:
  edge:
    name: ucms_edge
    external: true
  # Pre-existing network created by another project's compose stack, carrying its
  # nginx-proxy container; this app joins it only so that proxy can resolve "ucms-web"
  # by name. Not ours to manage — never declare other services on it.
  legacy:
    name: ucms_default
    external: true
  app:
    name: ucms_app
    external: true
  data:
    name: ucms_data
    external: true
