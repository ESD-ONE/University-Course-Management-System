# Deploys the application services onto the Contabo host, joining the existing
# `ucms_default` network created by the infra stack at /opt/ucms/docker-compose.infra.yml
# (Postgres/Redis/RabbitMQ/MinIO). Services reach those by container name on the
# internal network — the 127.0.0.1-only published ports are for the SSH-tunnelled
# local dev workflow only, not used here.
#
# One shared Postgres database ("ucms"), one schema per service — identity-access-service
# connects with its own schema-scoped role (identity_access_svc), not the admin role.
# See infra/init-schemas.sh and docs/architecture/DATA_GOVERNANCE.md.
#
# Every service below has a healthcheck against its own /actuator/health, and every
# depends_on uses `condition: service_healthy` rather than the bare service-name form.
# Docker Compose only waits for "container started" with the bare form — it does NOT
# wait for the Java process inside to actually be ready, so on every redeploy the
# gateway (and academic-structure-service's Role Catalog sync) came up 30-40s before
# identity-access-service finished its Spring Boot boot, producing a window of
# Connection-refused 500s/502s for anyone hitting the app right after a deploy. The
# healthcheck + condition pair is what actually closes that window, instead of relying
# on restart timing lining up.
#
# Usage on the server:
#   cd /opt/ucms-app && docker compose --env-file .env up -d --build

services:
  identity-access-service:
    build:
      context: ../services/identity-access-service
    container_name: ucms-identity-access-service
    restart: unless-stopped
    environment:
      DB_HOST: ucms-postgres
      DB_PORT: 5432
      DB_NAME: ucms
      DB_USER: identity_access_svc
      DB_PASSWORD: ${IDENTITY_ACCESS_SVC_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: 60
    healthcheck: &service-healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks:
      - ucms_default

  reference-data-service:
    build:
      context: ../services/reference-data-service
    container_name: ucms-reference-data-service
    restart: unless-stopped
    environment:
      DB_HOST: ucms-postgres
      DB_PORT: 5432
      DB_NAME: ucms
      DB_USER: reference_data_svc
      DB_PASSWORD: ${REFERENCE_DATA_SVC_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
    networks:
      - ucms_default

  academic-structure-service:
    build:
      context: ../services/academic-structure-service
    container_name: ucms-academic-structure-service
    restart: unless-stopped
    environment:
      DB_HOST: ucms-postgres
      DB_PORT: 5432
      DB_NAME: ucms
      DB_USER: academic_structure_svc
      DB_PASSWORD: ${ACADEMIC_STRUCTURE_SVC_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Periodic role/permission-catalog sync (docs/SYSTEM_ARCHITECTURE_REPORT.md
      # section 12.3) — container-name reachable on the shared internal network.
      IDENTITY_SERVICE_URI: http://ucms-identity-access-service:8081
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
    depends_on:
      identity-access-service:
        condition: service_healthy
    networks:
      - ucms_default

  gateway:
    build:
      context: ../services/gateway
    container_name: ucms-gateway
    restart: unless-stopped
    environment:
      IDENTITY_SERVICE_URI: http://ucms-identity-access-service:8081
      REFERENCE_DATA_SERVICE_URI: http://ucms-reference-data-service:8083
      ACADEMIC_STRUCTURE_SERVICE_URI: http://ucms-academic-structure-service:8084
      # Defaults to http://localhost:4200 otherwise, so the browser's request from the
      # directly-exposed frontend (see web service below) gets rejected with 403.
      # Comma-separated — Spring's Binder splits a single CSV string into the List<String>
      # allowedOrigins expects. esd.azhosting.fun is the real domain (HTTPS, via the
      # proj001-nginx-proxy-1 container reverse-proxying to ucms-web); the bare IP:port
      # is kept so direct access still works too.
      CORS_ALLOWED_ORIGIN: https://esd.azhosting.fun,http://169.58.12.239:8091
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      identity-access-service:
        condition: service_healthy
      reference-data-service:
        condition: service_healthy
      academic-structure-service:
        condition: service_healthy
    networks:
      - ucms_default

  web:
    build:
      context: ../web
    container_name: ucms-web
    restart: unless-stopped
    ports:
      # Exposed directly on the host's public IP, not loopback-only, on a
      # non-standard port because 80/443 already belong to another project's
      # nginx-proxy: http://<host>:8091 (requires `ufw allow 8091/tcp`).
      # The real, HTTPS entry point is https://esd.azhosting.fun — that
      # project's proxy container is attached to this stack's ucms_default
      # network (`docker network connect ucms_default proj001-nginx-proxy-1`)
      # and reverse-proxies to this container by name. See docs/LOGIN_USERS.md.
      - "8091:80"
    depends_on:
      gateway:
        # So the frontend never comes up (or restarts) fronting a gateway that's still
        # 502-ing because a backend behind it hasn't finished starting yet.
        condition: service_healthy
    networks:
      - ucms_default

networks:
  ucms_default:
    external: true
